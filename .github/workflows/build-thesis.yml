name: Build thesis PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false

      - name: Upload PDF (download from the run's Summary page)
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: main.pdf

      - name: Publish PDF to the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest thesis build
          body: Automatically built from the most recent commit on main.
          files: main.pdf
          make_latest: true
